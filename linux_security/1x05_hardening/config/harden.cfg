# SSH Configuration
SSH_PORT=2222
ALLOWED_SSH_USERS="student"

# Firewall
ALLOW_HTTP=yes
ALLOW_HTTPS=yes

# Password Policy
PASS_MIN_LEN=12
PASS_MAX_DAYS=90
FAIL_LOCK_ATTEMPTS=5

# Packages
BLOATWARE="telnet ftp netcat-traditional"
REQUIRED_TOOLS="auditd fail2ban"

# Logging
LOG_FILE="/var/log/hardening.log"
