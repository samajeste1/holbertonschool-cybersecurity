# SSH Configuration
SSH_PORT=2222
SSH_CONFIG="/etc/ssh/sshd_config"
ALLOWED_SSH_USERS="student"

# Firewall
ALLOW_HTTP=yes
ALLOW_HTTPS=yes
FIREWALL_POLICY_FILE="/etc/hardening/firewall.rules"

# Kernel
SYSCTL_FILE="/etc/sysctl.conf"

# Password Policy
PASS_MIN_LEN=12
PASS_MIN_CLASS=4
PASS_MAX_DAYS=90
FAIL_LOCK_ATTEMPTS=5
PWQUALITY_CONF="/etc/security/pwquality.conf"
LOGIN_DEFS="/etc/login.defs"
FAILLOCK_CONF="/etc/security/faillock.conf"
PAM_COMMON_AUTH="/etc/pam.d/common-auth"
PASSWD_FILE="/etc/passwd"

# Users: regular accounts (UID >= MIN_USER_UID) not in AUTHORIZED_USERS
# and not in an admin group are removed.
MIN_USER_UID=1000
AUTHORIZED_USERS="student"
ADMIN_GROUPS="sudo wheel"

# Packages
BLOATWARE="telnet ftp netcat-traditional"
REQUIRED_TOOLS="auditd fail2ban"

# Logging and report
LOG_FILE="/var/log/hardening.log"
REPORT_FILE="audit_report.txt"
