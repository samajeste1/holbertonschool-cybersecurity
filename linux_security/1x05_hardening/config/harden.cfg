# SSH Configuration
SSH_PORT=2222
SSH_CONFIG="/etc/ssh/sshd_config"
SSH_CONFIG_DIR="/etc/ssh/sshd_config.d"
ALLOWED_SSH_USERS="student"

# Firewall
ALLOW_HTTP=yes
ALLOW_HTTPS=yes
FIREWALL_POLICY_FILE="/etc/hardening/firewall.rules"

# Kernel
SYSCTL_FILE="/etc/sysctl.conf"

# Password Policy
PASS_MIN_LEN=12
PASS_MIN_CLASS=4
PASS_MAX_DAYS=90
FAIL_LOCK_ATTEMPTS=5
FAIL_LOCK_UNLOCK_TIME=900
PWQUALITY_CONF="/etc/security/pwquality.conf"
LOGIN_DEFS="/etc/login.defs"
FAILLOCK_CONF="/etc/security/faillock.conf"
PAM_COMMON_PASSWORD="/etc/pam.d/common-password"
PAM_COMMON_AUTH="/etc/pam.d/common-auth"
PAM_COMMON_ACCOUNT="/etc/pam.d/common-account"

# Users: accounts with UID > USER_UID_THRESHOLD (below NOBODY_UID) that
# are not in ADMIN_GROUPS are deleted. ALLOWED_SSH_USERS are always kept.
USER_UID_THRESHOLD=1000
NOBODY_UID=65534
ADMIN_GROUPS="sudo wheel"
PASSWD_FILE="/etc/passwd"

# Packages
BLOATWARE="telnet ftp netcat-traditional"
REQUIRED_TOOLS="auditd fail2ban"

# Logging and report
LOG_FILE="/var/log/hardening.log"
REPORT_FILE="audit_report.txt"
