services:
  hardened:
    build:
      context: .
      dockerfile: Dockerfile
    image: novatech-hardened-shield:1.0
    container_name: novatech-hardened-shield
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - AUDIT_WRITE
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    cpus: 0.50
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /run:rw,size=32m
      - /var/log:rw,nosuid,nodev,size=64m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/lib/nginx:rw,noexec,nosuid,size=32m
    volumes:
      - ./config/www:/var/www/html:ro
      - app-ssh:/home/appuser/.ssh
    ports:
      - "80:80"
      - "22:22"

volumes:
  app-ssh:
